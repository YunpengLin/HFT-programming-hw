name: HW13 Linux hardware counters
on:
  push:
    branches: [hw13-compiler-benchmark]
    paths: ['hw13/measure_pmu.py', '.github/workflows/hw13-pmu.yml']
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate Linux perf
        run: |
          if ! find /usr/lib/linux-tools -name perf -print -quit 2>/dev/null | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq linux-tools-generic
          fi
      - name: Probe counters and measure matched builds
        run: python3 hw13/measure_pmu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw13-arm64-pmu
          path: hw13/pmu-*/
          if-no-files-found: ignore
