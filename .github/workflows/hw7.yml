name: HW7 Book and SymMap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: hw7
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compiler
        run: g++ --version
      - name: Course tests, extended correctness and ns/op
        run: python3 scripts/run_checks.py
      - name: Address and undefined-behavior checks
        run: python3 scripts/run_checks.py --sanitize
